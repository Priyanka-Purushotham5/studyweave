# Runs only Module B; A and C are not present in this workspace.
services:
  mongo:
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1})"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017
      AI_MODE: fake
      NODE_ENV: test
      ENABLE_DEV_SEED: "true"
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      mongo:
        condition: service_healthy
