name: Team production deployment
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy the current main commit or restore a recorded backup
        type: choice
        required: true
        options: [deploy, rollback]
      target:
        description: Full current main SHA (deploy) or backup ID (rollback)
        required: true
        type: string
permissions:
  contents: read
  checks: read
  actions: read
concurrency:
  group: studynova-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Reject untrusted refs
        if: github.ref != 'refs/heads/main'
        run: exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Verify protected main and required CI
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TARGET: ${{ inputs.target }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [ "$OPERATION" = deploy ]; then
            python3 deploy/team/verify-main.py "$REQUESTED_TARGET"
          elif [ "$OPERATION" = rollback ]; then
            [[ "$REQUESTED_TARGET" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9a-f]{7}$ ]]
            python3 deploy/team/verify-main.py "$(git rev-parse HEAD)" --rollback
          else exit 1; fi
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Execute restricted server command
        env:
          DEPLOY_KEY: ${{ secrets.STUDYNOVA_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.STUDYNOVA_SSH_KNOWN_HOSTS }}
          HOST: ${{ vars.STUDYNOVA_DEPLOY_HOST }}
          OPERATION: ${{ inputs.operation }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS" && test -n "$HOST"
          [[ "$HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          if [ "$OPERATION" = deploy ]; then [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]
          elif [ "$OPERATION" = rollback ]; then [[ "$TARGET" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9a-f]{7}$ ]]
          else exit 1; fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/studynova_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/studynova_deploy" "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/studynova_deploy" "$HOME/.ssh/known_hosts"' EXIT
          ssh -i "$HOME/.ssh/studynova_deploy" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "studynova-deploy@$HOST" "$OPERATION $TARGET"
