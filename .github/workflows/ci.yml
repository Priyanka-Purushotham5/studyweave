name: ci
on: [push, pull_request]
jobs:
  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
  api:
    runs-on: ubuntu-latest
    env:
      AI_INTEGRATION_URL: http://127.0.0.1:8001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm run build
        working-directory: api
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r ai-service/requirements.txt
      - name: Start key-free Module A
        run: |
          FAKE_GEMINI=1 nohup python -m uvicorn app.main:app --app-dir ai-service --host 127.0.0.1 --port 8001 > /tmp/studyweave-ai.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8001/healthz; then exit 0; fi
            sleep 1
          done
          cat /tmp/studyweave-ai.log
          exit 1
      - run: npm test
        working-directory: api
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run test:components
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_MOCK: "0"
          VITE_API_URL: ""
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_MOCK: "1"
          VITE_API_URL: ""
      - run: npm run test:browser
        working-directory: web
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jsonschema
      - run: python contracts/validate.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci && npm test -- tests/contracts.test.ts tests/shared-contracts.test.ts
        working-directory: api
